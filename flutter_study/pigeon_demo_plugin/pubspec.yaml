name: pigeon_demo_plugin
description: A small Flutter plugin demo that uses Pigeon for type-safe platform channels.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^25.5.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.pigeon_demo_plugin
        pluginClass: PigeonDemoPlugin
      ios:
        pluginClass: PigeonDemoPlugin
